<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Excel 統合ツール</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='4' width='28' height='24' rx='4' fill='%231f6feb'/%3E%3Cpath d='M2 12h28M2 20h28M12 4v24M21 4v24' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root">
      <p style="margin: 40px; font: 14px 'Yu Gothic UI', Meiryo, sans-serif; color: #777">読み込み中…</p>
    </div>
    <script>
      // never a blank / stuck screen: if the app has not started after a while (a script failed to load),
      // say so in Japanese. main.tsx sets window.__excelMergerStarted.
      (function () {
        function fail(detail) {
          if (window.__excelMergerStarted) return;
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML =
            '<div style="margin:40px;padding:20px 24px;border:1px solid #e39a9a;border-radius:6px;background:#fff;font:14px \'Yu Gothic UI\',Meiryo,sans-serif;color:#222">' +
            '<h2 style="margin:0 0 8px;font-size:16px;color:#a11a1a">アプリを起動できませんでした</h2>' +
            '<p style="margin:0 0 8px">画面を再読み込みしてください（F5）。直らない場合はアプリを起動し直してください。</p>' +
            '<p style="margin:0;font:12px Consolas,monospace;color:#666"></p></div>';
          root.querySelector('p:last-child').textContent = detail ? '技術情報: ' + detail : '';
        }
        window.addEventListener('error', function (e) {
          if (!window.__excelMergerStarted && e && e.message) setTimeout(function () { fail(e.message); }, 3000);
        });
        setTimeout(function () { fail('起動に時間がかかっています'); }, 20000);
      })();
    </script>
    <noscript>
      <p style="margin: 40px; font: 14px 'Yu Gothic UI', Meiryo, sans-serif">このアプリを使うには JavaScript を有効にしてください（Microsoft Edge での利用をおすすめします）。</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
